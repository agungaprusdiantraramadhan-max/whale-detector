name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Complete Android Project
        run: |
          # Buat proyek Flutter utuh sementara
          flutter create temp_app
          
          # Salin folder android standar yang lengkap ke proyek utama jika belum ada wrapper
          cp -r temp_app/android .
          rm -rf temp_app

          # Pulihkan kembali AndroidManifest kustom jika tertimpa
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            echo "AndroidManifest siap"
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-detector-app
          path: build/app/outputs/flutter-apk/app-release.apk
