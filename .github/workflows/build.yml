name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'

      - name: Reconstruct Flutter Project Structure
        run: |
          # Simpan file yang sudah dibuat
          mkdir -p /tmp/backup
          cp pubspec.yaml /tmp/backup/
          cp -r lib /tmp/backup/
          
          # Buat struktur Flutter bersih dan resmi
          cd ..
          flutter create --org com.quant.whaledetector whale_clean
          cd whale_clean
          
          # Kembalikan file lib dan pubspec
          cp /tmp/backup/pubspec.yaml .
          cp -r /tmp/backup/lib/* lib/
          
          # Salin kembali ke direktori kerja utama
          cp -r ./* $GITHUB_WORKSPACE/
          cd $GITHUB_WORKSPACE

          # Tambahkan izin INTERNET ke AndroidManifest
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET"/>\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: whale-detector-release
          path: build/app/outputs/flutter-apk/app-release.apk
